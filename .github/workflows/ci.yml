name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pretest:integration
      - run: xvfb-run -a pnpm run test:integration

  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jetbrains
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-jetbrains
          path: jetbrains/build/distributions/*.zip

  visualstudio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: dotnet restore visualstudio/Depos.VisualStudio.sln
      - run: dotnet test visualstudio/Depos.Core.Tests/Depos.Core.Tests.csproj --no-restore --nologo
      - run: dotnet test visualstudio/Depos.VisualStudio.Tests/Depos.VisualStudio.Tests.csproj --no-restore --nologo -p:CreateVsixContainer=false -p:DeployExtension=false -m:1
      - run: msbuild visualstudio/Depos.VisualStudio/Depos.VisualStudio.csproj /restore /t:Build /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /m:1
      - name: Verify Visual Studio VSIX
        shell: pwsh
        run: ./visualstudio/verify-vsix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: depos-visualstudio-vsix
          path: visualstudio/Depos.VisualStudio/bin/Release/net472/depos-visualstudio.vsix

  # The IntelliJ Plugin Verifier, against the build target and the newest
  # release of every later IDE branch (pluginVerification.ides in
  # jetbrains/build.gradle.kts). The Marketplace approval guidelines ask for
  # this before each upload, and the Marketplace runs it again after. It
  # downloads each of those IDEs, so it is its own job and nothing waits for
  # it; the run still goes red on a compatibility problem. The full report is
  # the artifact.
  jetbrains-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jetbrains
        run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pacmon-jetbrains-verifier
          path: jetbrains/build/reports/pluginVerifier

  package:
    runs-on: ubuntu-latest
    needs: [test, integration, jetbrains]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node esbuild.mjs --production
      - run: pnpm exec vsce package --no-dependencies -o pacmon.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-vsix
          path: pacmon.vsix
