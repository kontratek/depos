name: Release

# Publishing is a button, never a side effect of merging. Actions -> Release ->
# Run workflow, pick patch / minor / major. The run raises the version, turns the
# CHANGELOG's "Unreleased" section into that version, runs the whole test suite,
# builds one VS Code VSIX, one JetBrains plugin zip and one Visual Studio VSIX,
# pushes the version commit and its tag to main, sends the VS Code VSIX to the
# Visual Studio Marketplace and to Open VSX, submits the zip to the JetBrains
# Marketplace, which lists it after its own review, and sends the Visual Studio
# VSIX to the Visual Studio Marketplace. All three files go on the GitHub Release.
#
# The Visual Studio VSIX builds and publishes only on Windows, so the run is four
# jobs: `version` decides the version and the release notes once; `visualstudio`
# builds and tests the Visual Studio VSIX from them; `release` tests and builds
# the rest, commits, tags and publishes, and starts only once that VSIX is good;
# `visualstudio-publish` sends the VSIX after the tag is on the remote.
#
# A version number is spent the moment a registry accepts it, so nothing here is
# retried blindly. Every publish step skips a version the registry already has,
# and the version commit is skipped when its tag is already on the remote — so
# "Re-run failed jobs" is the recovery path after an expired token, and it
# cannot raise the version a second time. Run workflow with "none" publishes the
# version already in package.json to whichever registry still lacks it and
# commits nothing: the path for a registry that joined after a release.
#
# Tokens are the VSCE_PAT, OVSX_PAT and JETBRAINS_TOKEN repository secrets;
# VSCE_PAT publishes to both the VS Code and the Visual Studio side of the
# Visual Studio Marketplace. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise. "none" publishes the version already in package.json to any registry that does not have it yet, and commits nothing.'
        required: true
        type: choice
        options: [patch, minor, major, none]
        default: patch
  # Escape hatch: a hand-pushed tag releases the version already in
  # package.json, whose CHANGELOG section must already exist.
  push:
    tags: ['v*']

permissions:
  contents: write # the version commit, the tag, and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version and the release notes are decided here, once. The jobs below
  # copy package.json, CHANGELOG.md and release-notes.md from this job, so the
  # Windows build and the Linux one carry the same version.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Anyone with write access can press the button; only these accounts get
      # past this step, and nothing has run yet when it fails. ACTOR arrives as
      # an environment variable rather than inline ${{ }} so a crafted login
      # cannot become shell.
      - name: Authorize actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED="yavuzatlas yavuzatlas-kontra"
          if echo " $ALLOWED " | grep -qF " $ACTOR "; then
            echo "Authorized: $ACTOR"
          else
            echo "::error::'$ACTOR' may not publish Depos (allowlist: $ALLOWED)."
            exit 1
          fi

      # Pinned to the triggering commit, so a re-run sees the identical tree and
      # computes the identical version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set the version and the release notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$BUMP" != "none" ]; then
            # The notes are written under "## Unreleased" as work lands; the
            # release names that section.
            grep -q '^## Unreleased$' CHANGELOG.md || {
              echo "::error::CHANGELOG.md has no '## Unreleased' section."; exit 1; }
            if ! awk '/^## Unreleased$/{on=1;next} /^## /&&on{exit} on' CHANGELOG.md | grep -q '[^[:space:]]'; then
              echo "::error::The '## Unreleased' section is empty — write what changed before releasing."
              exit 1
            fi
            pnpm version "$BUMP" --no-git-tag-version --no-git-checks > /dev/null
            version=$(node -p "require('./package.json').version")
            # A fresh, empty "Unreleased" is left above it for the next round.
            sed -i "0,/^## Unreleased$/s//## Unreleased\n\n## $version — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          else
            # A tag pushed by hand, or "none" from the button: the version already
            # in package.json goes out again, to whichever registry still lacks it.
            version=$(node -p "require('./package.json').version")
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
              echo "::error::v$version has not been released, so there is nothing to publish again; pick patch, minor or major."
              exit 1
            fi
          fi
          awk -v v="$version" '$0 ~ ("^## " v "([^0-9.]|$)") {on=1;next} /^## /&&on{exit} on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Every upload in this workflow overwrites: a job that runs again under
      # "Re-run failed jobs" finds its own artifact from the first attempt, and
      # an upload that may not replace it fails the job before it publishes.
      - uses: actions/upload-artifact@v7
        with:
          name: release-version
          path: |
            package.json
            CHANGELOG.md
            release-notes.md
          overwrite: true

  # The Visual Studio VSIX, from the same tree at the same version. The VSSDK
  # build runs only on Windows. A failure here stops the release before anything
  # is committed or published, like a failing test in the job below.
  visualstudio:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: ${{ runner.temp }}/release-version
      # The project reads its version from the root package.json.
      - name: Apply the release version
        shell: pwsh
        run: Copy-Item "$env:RUNNER_TEMP/release-version/package.json", "$env:RUNNER_TEMP/release-version/CHANGELOG.md" -Destination .

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: dotnet restore visualstudio/Depos.VisualStudio.sln
      - run: dotnet test visualstudio/Depos.Core.Tests/Depos.Core.Tests.csproj --no-restore --nologo
      - run: dotnet test visualstudio/Depos.VisualStudio.Tests/Depos.VisualStudio.Tests.csproj --no-restore --nologo -p:CreateVsixContainer=false -p:DeployExtension=false -m:1
      - run: msbuild visualstudio/Depos.VisualStudio/Depos.VisualStudio.csproj /restore /t:Build /p:Configuration=Release /p:DeployExtension=false /p:CreateVsixContainer=true /m:1
      - name: Verify the Visual Studio VSIX
        shell: pwsh
        run: ./visualstudio/verify-vsix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: depos-visualstudio-vsix
          path: visualstudio/Depos.VisualStudio/bin/Release/net472/depos-visualstudio.vsix
          overwrite: true

  release:
    needs: [version, visualstudio]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: ${{ runner.temp }}/release-version
      - name: Apply the release version
        run: cp "$RUNNER_TEMP"/release-version/{package.json,CHANGELOG.md,release-notes.md} .

      # Everything below runs against the tree that actually ships.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run pretest:integration
      - run: xvfb-run -a pnpm run test:integration

      # vsce package runs vscode:prepublish, which is the production build.
      - run: pnpm exec vsce package --no-dependencies -o pacmon.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-vsix
          path: pacmon.vsix
          overwrite: true

      # The JetBrains plugin, from the same tree at the same version: its
      # build.gradle.kts reads the version the step above wrote to package.json
      # and renders that version's CHANGELOG section into the change notes. The
      # Plugin Verifier is not run here; CI runs it on every push to main.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jetbrains
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-jetbrains
          path: jetbrains/build/distributions/*.zip
          overwrite: true

      # The Visual Studio VSIX the job before this one built and verified, for
      # the GitHub Release.
      - uses: actions/download-artifact@v8
        with:
          name: depos-visualstudio-vsix

      # Git first: the history should record a release before the registries
      # can hand it to anyone. A push with the built-in token starts no further
      # workflow run, so main does not re-run CI for this commit.
      - name: Push the version commit and its tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already on the remote — resuming an earlier run, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "$TAG"
          # Fails rather than forces if main moved after the button was pressed.
          git push origin "HEAD:main"
          git push origin "$TAG"

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath pacmon.vsix --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish --packagePath pacmon.vsix --skip-duplicate

      # JetBrains reviews every version by hand before listing it, normally within
      # two business days, so this step submits rather than publishes. The
      # Marketplace refuses a version it already has, so a re-run asks the
      # plugin's update list first and skips, the way --skip-duplicate does above.
      - name: Submit to the JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
          PLUGIN_ID: 34295 # plugins.jetbrains.com/plugin/34295
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: jetbrains
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $JETBRAINS_TOKEN" \
               "https://plugins.jetbrains.com/api/plugins/$PLUGIN_ID/updates?size=100" \
             | jq -e --arg v "$VERSION" 'any(.[]; .version == $v)' > /dev/null; then
            echo "The JetBrains Marketplace already has $VERSION - skipping."
          else
            ./gradlew publishPlugin
          fi

      # The Release carries the three packages, for anyone installing without a
      # registry.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" pacmon.vsix jetbrains/build/distributions/*.zip depos-visualstudio.vsix --clobber
          else
            gh release create "$TAG" pacmon.vsix jetbrains/build/distributions/*.zip depos-visualstudio.vsix --title "$TAG" --notes-file release-notes.md
          fi

  # Visual Studio extensions go to their own side of the Visual Studio
  # Marketplace through VsixPublisher, a Windows tool, so this runs on Windows
  # after the job above has pushed the tag. The listing is
  # marketplace.visualstudio.com/items?itemName=kontra.pacmon-visualstudio; its
  # page and categories are visualstudio/marketplace/.
  visualstudio-publish:
    needs: [version, release]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: depos-visualstudio-vsix

      # VsixPublisher ships in the Microsoft.VSSDK.BuildTools package. The 17.14
      # the project builds with crashes in its telemetry and exits with a failure
      # code even after a successful upload; 18.9 exits cleanly.
      - name: Fetch VsixPublisher
        shell: pwsh
        env:
          VSSDK_VERSION: 18.9.820
        run: |
          $package = Join-Path $env:RUNNER_TEMP vssdk
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.vssdk.buildtools/$env:VSSDK_VERSION/microsoft.vssdk.buildtools.$env:VSSDK_VERSION.nupkg" -OutFile "$package.zip"
          Expand-Archive "$package.zip" $package -Force
          "VSIXPUBLISHER=$package\tools\vssdk\bin\VsixPublisher.exe" >> $env:GITHUB_ENV

      # The Visual Studio Marketplace overwrites a version it already has
      # instead of refusing it, so this asks first and skips, the way
      # --skip-duplicate does for VS Code: a re-run, or "none" from a later
      # commit, must not replace a build that is already out.
      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $manifest = Resolve-Path visualstudio/marketplace/publishManifest.json
          $listing = Get-Content $manifest -Raw | ConvertFrom-Json
          $item = "$($listing.publisher).$($listing.identity.internalName)"
          # filterType 7 looks the extension up by "publisher.name"; flags 1
          # includes every version.
          $query = @{ filters = @(@{ criteria = @(@{ filterType = 7; value = $item }) }); flags = 1 } | ConvertTo-Json -Depth 5 -Compress
          $result = Invoke-RestMethod -Method Post -Uri https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery `
            -Headers @{ Accept = 'application/json;api-version=3.0-preview.1' } -ContentType application/json -Body $query
          if (@($result.results[0].extensions.versions.version) -contains $env:VERSION) {
            "The Visual Studio Marketplace already has $item $env:VERSION - skipping."
            exit 0
          }
          & $env:VSIXPUBLISHER publish -payload (Resolve-Path depos-visualstudio.vsix) -publishManifest $manifest -personalAccessToken $env:VSCE_PAT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
