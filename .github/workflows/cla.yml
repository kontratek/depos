name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # contributor-assistant/github-action v2.6.1, pinned to a commit SHA rather than a tag.
      # This job runs on pull_request_target with write permissions: it must
      # never check out or execute code from the pull request.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The document contributors sign. The action only links it; the file
          # must exist on main before the first external pull request.
          # Versioned by name: a new CLA text gets a new file and a new
          # signatures path, so everyone signs again.
          path-to-document: https://github.com/kontratek/depos/blob/main/CLA-v1.md
          path-to-signatures: signatures/v1/cla.json
          # Signatures live on their own branch, so main can stay protected and
          # a signature commit does not trigger CI. Push it once:
          #   git push origin cla-signatures
          branch: cla-signatures
          # Maintainer accounts and GitHub App bots (dependabot[bot], renovate[bot], ...).
          # Patterns are unanchored: "bot*" would also match human logins that
          # contain "bot"; "*[bot]" matches only app accounts.
          allowlist: "yavuzatlas,yavuzatlas-kontra,*[bot]"
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can review it, please
            read the CLA linked above and sign by commenting the sentence below.
          custom-pr-sign-comment: >-
            I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: true