version = 1
requires-python = ">=3.9"

[[package]]
name = "pacmon-python-fixture"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "importlib-metadata", marker = "python_full_version < '3.10'" },
    { name = "requests" },
]

[package.optional-dependencies]
docs = [
    { name = "sphinx" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
]

[package.metadata]
requires-dist = [
    { name = "importlib-metadata", marker = "python_full_version < '3.10'", specifier = ">=7" },
    { name = "requests", specifier = ">=2.31" },
    { name = "sphinx", marker = "extra == 'docs'", specifier = ">=7" },
]

